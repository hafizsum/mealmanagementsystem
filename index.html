try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.name+" "+mon});return}}catch(e){if(e&&e.name=="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Image downloaded. Send on WhatsApp.","#0f7b4f")},"image/png")}
const cpy=(i,b)=>{const e=$(i);e.select();e.setSelectionRange(0,99999);try{navigator.clipboard.writeText(e.value)}catch(x){}try{document.execCommand("copy")}catch(x){}$(b).textContent="Copied ✓"};
const shareCard=t=>`<div class="c"><b>Link ready ✓</b><textarea id="sc" rows="3" readonly>${esc(t)}</textarea><button id="cp">Copy</button><a class="b" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">Send on WhatsApp</a><button class="g" id="cl">Close</button></div>`;
function calc(){const ms={};S.mem.forEach(m=>ms[m]=0);
for(const d in S.meals)if(d.startsWith(mon))for(const m in S.meals[d])if(m in ms)ms[m]+=S.meals[d][m];
const tm=Object.values(ms).reduce((a,b)=>a+b,0),tb=S.bz.filter(x=>x.d.startsWith(mon)).reduce((a,x)=>a+x.a,0),rate=tm?tb/tm:0,n0=S.mem.length||1,cm=(S.cm[mon]||0)/n0,rn=((S.rent&&S.rent[mon])||0)/n0,nt=((S.net&&S.net[mon])||0)/n0,fx=cm+rn+nt;
const bzm={};S.bz.filter(x=>x.d.startsWith(mon)).forEach(x=>{const k=x.b||"";bzm[k]=(bzm[k]||0)+x.a});
const rows=S.mem.map(m=>{const dp0=S.dp.filter(x=>x.d.startsWith(mon)&&x.m==m).reduce((a,x)=>a+x.a,0),bz=bzm[m]||0,dep=bz,mc=ms[m]*rate,cost=mc+fx;return{m,meals:ms[m],dep,bz,mc,fx,cost,bal:dep-cost}});
return{tm,tb,rate,rows,cm,rn,nt,fx,tcm:S.cm[mon]||0,trn:(S.rent&&S.rent[mon])||0,tnt:(S.net&&S.net[mon])||0,oth:bzm[""]||0}}
async function boot(){
if(CFG.key.startsWith("YOUR"))return A.innerHTML=`<h1>🍛 Mess Hisab</h1><div class="c"><b>Setup required</b><p class="m">Set your Firebase API key and database URL in CFG at the top of the file.</p></div>`;
const h=location.hash;if(h.startsWith("#v="))return memberBoot(h.slice(3));
if(!sess)return loginUI();
try{await tok();const d=await db("GET","mess/"+sess.uid+"/data");S=d?norm(d):null;if(S)await loadPend();PD.forEach(p=>seen.add(p.k));draw();autoSnap()}
catch(e){const c=lget("mh3");if(c){S=norm(c);draw();setSt("⚠️ Offline: "+e.message)}else{toast(e.message);loginUI()}}}
function loginUI(){A.innerHTML=`<h1>🍛 Mess Hisab</h1><p class="m">Admin login. Only the admin can change meals, bazar and members.</p><div class="c"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (at least 6 characters)"><button id="li">Login</button><button class="g" id="su">Create new mess (sign up)</button></div>`;
const go=c=>async()=>{try{await login($("em").value.trim(),$("pw").value,c);boot()}catch(e){toast(e.message)}};
$("li").onclick=go(false);$("su").onclick=go(true)}
function setup(){A.innerHTML=`<h1>🍛 New Mess</h1><div class="c"><input id="n" placeholder="Mess name"><textarea id="u" rows="5" placeholder="Member names (separate with commas or new lines)"></textarea><button id="go">Get started</button></div>`;
$("go").onclick=()=>{const m=$("u").value.split(/[,\n]/).map(clean).filter(Boolean);if(!m.length)return alert("Add at least one member");S=norm({name:$("n").value.trim()||"Our Mess",mem:[...new Set(m)]});save();draw()}}
function draw(){if(!S)return setup();if(!window.pt)window.pt=setInterval(poll,20000);
const T=[["m","Meals","🍽️"],["b","Bazar","🛒"],["s","Summary","📊"]],R0=calc();
const bnr=(S.lastWa!==today()&&S.mem.length)?'<div class="bn"><span>📲 Backup not sent on WhatsApp today</span><button class="x" id="bnb">Send</button></div>':"";
const nav=`<nav class="nav">${T.map(x=>`<button data-t="${x[0]}" class="${tab==x[0]?"a":""}"><i>${x[2]}</i>${x[1]}${x[0]=="b"&&PD.length?"<em>"+PD.length+"</em>":""}</button>`).join("")}</nav>`;
let h=`<div class="top"><div class="tl"><div class="nm">${esc(S.name)}</div><div class="m" id="st">☁️</div></div><div class="act"><button class="x" id="cd" title="Statement card">📸</button><button class="x" id="nt">🔔</button><button class="x" id="lo">Logout</button></div></div><div class="mb"><input type="month" id="mo" value="${mon}"></div><div class="stats"><div class="sc"><span>Total Bazar</span><b>৳${f(R0.tb)}</b></div><div class="sc"><span>Total Meals</span><b>${f(R0.tm)}</b></div><div class="sc"><span>Meal Rate</span><b>৳${f(R0.rate)}</b></div></div>${bnr}`;
if(tab=="m"){const dm=S.meals[date]||{},tot=S.mem.reduce((a,m)=>a+(dm[m]||0),0);
h+=`<div class="c"><input type="date" id="dt" value="${date}"><div class="m">Total meals this day: <b>${f(tot)}</b></div>${S.mem.map((m,i)=>`<div class="r"><span>${esc(m)}</span><div class="q"><button data-i="${i}" data-d="-0.5">−</button><b>${f(dm[m]||0)}</b><button data-i="${i}" data-d="0.5">+</button></div></div>`).join("")}</div><div class="c"><input id="nm" placeholder="New member name"><button class="g" id="am">Add member</button></div>`}
if(tab=="b"){const l=S.bz.filter(x=>x.d.startsWith(mon)).sort((a,b)=>b.d.localeCompare(a.d));
h+=`<div class="c"><div class="r"><b>Bazar sent by members</b><button class="x" id="rf">Refresh</button></div>${PD.map(x=>`<div class="r"><span>${esc(x.u)}: ${esc(String(x.d).slice(5))} ${esc(x.n||"")}<br><b>৳${f(+x.a)}</b></span><span><button class="x" data-ok="${x.k}">✓</button><button class="x d" data-no="${x.k}">✗</button></span></div>`).join("")||'<p class="m">Nothing new</p>'}</div>
<div class="c"><input type="date" id="dt" value="${date}"><input id="ba" type="number" inputmode="decimal" placeholder="Bazar amount ৳"><select id="bb"><option value="">Who did the bazar?</option>${S.mem.map(m=>`<option>${esc(m)}</option>`).join("")}</select><input id="bn" placeholder="What was bought"><button id="ab">Add bazar</button></div><div class="c"><b>Bazar · ${mon}</b>${bzList(l,true)}</div>`}
if(tab=="s"){const r=calc();if(lk)h+=shareCard(lk.t);h+='<button id="cd2">📸 Send month-end statement card on WhatsApp</button>';
h+=`<div class="c"><label class="fl">House rent (split equally)</label><input id="fr" type="number" inputmode="decimal" placeholder="House rent ৳" value="${(S.rent&&S.rent[mon])||""}"><label class="fl">Internet bill (split equally)</label><input id="fi" type="number" inputmode="decimal" placeholder="Internet bill ৳" value="${(S.net&&S.net[mon])||""}"><label class="fl">Common cost: maid, gas, etc. (split equally)</label><input id="cm" type="number" inputmode="decimal" placeholder="Common cost ৳" value="${S.cm[mon]||""}"><label class="fl">Your WhatsApp number (members can notify you here)</label><input id="ph" placeholder="Your WhatsApp number (members can notify you)" value="${esc(S.ph||"")}"></div>
<div class="c"><b>Shared expenses (split equally)</b><div class="r"><span>House rent</span><b>৳${f(r.trn)}<span class="m"> · ৳${f(r.rn)} each</span></b></div><div class="r"><span>Internet bill</span><b>৳${f(r.tnt)}<span class="m"> · ৳${f(r.nt)} each</span></b></div><div class="r"><span>Common cost</span><b>৳${f(r.tcm)}<span class="m"> · ৳${f(r.cm)} each</span></b></div></div>
<div class="c">${r.rows.map(x=>`<div class="r"><span><b>${esc(x.m)}</b><br><span class="m">${f(x.meals)} meals · Bazar ৳${f(x.bz)} · Cost ৳${f(x.cost)}</span><br><span class="${x.bal<0?"n":"p"}">${x.bal<0?"To pay":"To receive"} ৳${f(Math.abs(x.bal))}</span></span><button class="x" data-l="${esc(x.m)}">Link</button></div>`).join("")}</div><p class="m">A member's link always shows live figures. Send it once.</p><div class="c"><b>Backup</b><p class="m">${S.lastWa?"Last WhatsApp backup: "+S.lastWa:"No WhatsApp backup sent yet"}. A cloud backup is saved automatically each day you open the app (last 95 days).</p><button id="bw">📲 Send backup on WhatsApp</button><button class="g" id="bd2">Download file</button><label class="fl">Restore from file<input type="file" id="bf" accept=".json,application/json"></label><div id="bl"></div></div><div class="c"><input id="rq" placeholder="Type RESET to delete"><button class="g" id="rs">Delete all data and start over</button></div>`}
A.innerHTML=h+nav;bind()}
function bind(){A.querySelectorAll("[data-t]").forEach(b=>b.onclick=async()=>{tab=b.dataset.t;lk=null;if(tab=="b")try{await loadPend()}catch(e){}draw()});
$("lo").onclick=()=>{sess=null;idt=null;lset("mhs",null);lset("mh3",null);S=null;loginUI()};
const dt=$("dt");if(dt)dt.onchange=()=>{if(dt.value){date=dt.value;mon=date.slice(0,7);draw()}};
A.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const m=S.mem[+b.dataset.i],d=S.meals[date]=S.meals[date]||{};d[m]=Math.max(0,(d[m]||0)+ +b.dataset.d);save();const y=scrollY;draw();scrollTo(0,y)});
A.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const k=b.dataset.x,id=+k.slice(1);if(b.dataset.s!="1"){b.dataset.s="1";b.textContent="Sure?";return}if(k[0]=="b")S.bz=S.bz.filter(x=>x.id!=id);else S.dp=S.dp.filter(x=>x.id!=id);save();draw()});
A.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{const p=PD.find(x=>x.k==b.dataset.ok);S.bz.push({id:uid(),d:String(p.d),a:+p.a,n:p.n||"",b:p.u});save();try{await db("DELETE","mess/"+sess.uid+"/pending/"+p.k)}catch(e){}PD=PD.filter(x=>x!=p);draw()});
A.querySelectorAll("[data-no]").forEach(b=>b.onclick=async()=>{try{await db("DELETE","mess/"+sess.uid+"/pending/"+b.dataset.no)}catch(e){}PD=PD.filter(x=>x.k!=b.dataset.no);draw()});
A.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const m=b.dataset.l;lk={t:`${S.name}: ${m}, View your meals and statement here:\n${location.href.split("#")[0]}#v=${sess.uid}~${encodeURIComponent(m)}`};draw();scrollTo(0,0)});
if($("cp"))$("cp").onclick=()=>cpy("sc","cp");
if($("cl"))$("cl").onclick=()=>{lk=null;draw()};
if($("rf"))$("rf").onclick=async()=>{try{await loadPend();draw()}catch(e){toast(e.message)}};

if($("ad"))$("ad").onclick=()=>{const a=+$("da").value;if(a>0){S.dp.push({id:uid(),d:date,m:$("dm").value,a});save();draw()}};
if($("mo"))$("mo").onchange=e=>{if(e.target.value){mon=e.target.value;draw()}};
if($("cm"))$("cm").onchange=e=>{S.cm[mon]=+e.target.value||0;save();draw()};
if($("fr"))$("fr").onchange=e=>{S.rent=S.rent||{};S.rent[mon]=+e.target.value||0;save();draw()};
if($("fi"))$("fi").onchange=e=>{S.net=S.net||{};S.net[mon]=+e.target.value||0;save();draw()};
if($("bw")){$("bw").onclick=waBackup;$("bd2").onclick=dlBackup;snapList();$("bf").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.mem)throw 0;S=norm(o);save();draw();toast("Restored","#0f7b4f")}catch(x){toast("Could not read the file")}};rd.readAsText(fl)}}
if($("bnb"))$("bnb").onclick=waBackup;
if($("cd"))$("cd").onclick=sendCard;if($("cd2"))$("cd2").onclick=sendCard;
if($("cr"))$("cr").onchange=e=>{S.cr=e.target.checked;save();draw()};
if($("ph"))$("ph").onchange=e=>{S.ph=e.target.value.trim();save()};
if($("nt"))$("nt").onclick=async()=>{try{const p=await Notification.requestPermission();toast(p=="granted"?"Notifications enabled":"Notifications off",p=="granted"?"#0f7b4f":null)}catch(e){toast("Not supported in this browser")}};
if($("rs"))$("rs").onclick=async()=>{if($("rq").value.trim()!="RESET")return alert("Type RESET to delete");try{await db("DELETE","mess/"+sess.uid+"/data")}catch(e){}S=null;lset("mh3",null);draw()}}
async function memberBoot(v){MEM=true;const i=v.indexOf("~"),id=v.slice(0,i),u=decodeURIComponent(v.slice(i+1));A.innerHTML='<p class="m">Loading…</p>';
try{const j=await anon();sess={rt:j.refreshToken,uid:j.localId};await load(id,u)}catch(e){A.innerHTML=`<p class="n">Failed to load: ${esc(e.message)}</p>`}}
async function load(id,u){const d=await db("GET","mess/"+id+"/data");if(!d)return A.innerHTML="<p class='n'>Mess not found</p>";S=norm(d);member(id,u)}

const ml=Object.keys(S.meals).filter(d=>d.startsWith(mon)&&S.meals[d][u]>0).sort(),bz=S.bz.filter(x=>x.d.startsWith(mon)).sort((a,b)=>b.d.localeCompare(a.d)),neg=r.bal<0;

<div class="mb"><input type="month" id="mo" value="${mon}"></div>
<div class="bal ${neg?"neg":"pos"}"><span>${neg?"You need to pay":"You will receive"}</span><b>৳${f(Math.abs(r.bal))}</b></div>
<div class="stats4"><div class="sc"><span>Your Meals</span><b>${f(r.meals)}</b></div><div class="sc"><span>Meal Rate</span><b>৳${f(R.rate)}</b></div><div class="sc"><span>Your Cost</span><b>৳${f(r.cost)}</b></div><div class="sc"><span>Your Bazar</span><b>৳${f(r.bz)}</b></div></div>
<div class="c"><b>🧮 Your cost breakdown</b><div class="r"><span>Meal cost (${f(r.meals)} × ৳${f(R.rate)})</span><b>৳${f(r.mc)}</b></div><div class="r"><span>House rent share</span><b>৳${f(R.rn)}</b></div><div class="r"><span>Internet share</span><b>৳${f(R.nt)}</b></div><div class="r"><span>Common cost share</span><b>৳${f(R.cm)}</b></div><div class="r"><b>Total cost</b><b>৳${f(r.cost)}</b></div></div>
<div class="c"><b>🍽️ Your Meals</b><div class="chips">${ml.map(d=>`<span class="chip">${d.slice(8)}/${d.slice(5,7)}<b>${f(S.meals[d][u])}</b></span>`).join("")||'<p class="m">No meals yet</p>'}</div></div>
<div class="c"><b>🛒 Report Bazar</b><input type="date" id="bd" value="${today()}"><input id="ba" type="number" inputmode="decimal" placeholder="Cost ৳"><input id="bn" placeholder="What was bought"><button id="bs">Send to admin</button><div id="so"></div><p class="m">The admin will verify and add it.</p></div>
<div class="c"><b>🧾 This month's bazar</b>${bzList(bz,false)}</div>`;
$("mo").onchange=e=>{if(e.target.value){mon=e.target.value;member(id,u)}};

boot();
